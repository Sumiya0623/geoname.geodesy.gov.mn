name: Deploy PROD backend

on:
  push:
    branches: [backend]
  workflow_dispatch:

concurrency:
  group: deploy-geoname-prod-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Deploy
        run: /var/www/prod.geoname.nextgis.mn/deploy-backend.sh
